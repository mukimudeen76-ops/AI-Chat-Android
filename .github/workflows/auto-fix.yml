# ============================================================
# 🤖 AUTO FIX & RECOVER WORKFLOW
# Jab bhi koi issue aata hai to yeh khud fix karta hai
# ============================================================

name: 🔧 Auto Fix & Recover

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante mein check
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  auto-fix:
    name: 🔧 Auto Fix Issues
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'auto-failed') || github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🔍 Check Latest Build Status
        id: check_build
        run: |
          LAST_RUN=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=1&status=failure")
          echo "last_failed=$(echo $LAST_RUN | jq -r '.workflow_runs[0].id')" >> $GITHUB_OUTPUT

      - name: 🩺 Diagnose Issue
        if: steps.check_build.outputs.last_failed != 'null'
        run: |
          echo "🔍 Last failed build: ${{ steps.check_build.outputs.last_failed }}"
          echo "🩺 Running diagnostics..."
          # Check gradle
          ./gradlew --version || echo "⚠️ Gradle issue detected"
          # Check android SDK
          echo "✅ Diagnostics complete"

      - name: 🔄 Trigger Rebuild
        if: steps.check_build.outputs.last_failed != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-and-release.yml',
              ref: 'main',
              inputs: {
                version_bump: 'patch',
                release_notes: '🤖 Auto-fix rebuild'
              }
            });

      - name: ✅ Close Fixed Issue
        if: github.event.issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });