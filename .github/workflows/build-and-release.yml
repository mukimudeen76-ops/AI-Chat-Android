# ============================================================
# ThinkForge AI - Complete Automated CI/CD Pipeline 🤖
# Yeh workflow sab kuch khud karega:
# ✅ Build Android App
# ✅ Auto Version Tag (v1.0.x)
# ✅ GitHub Release
# ✅ APK Upload
# ✅ Auto Push
# ============================================================

name: 🚀 ThinkForge AI Auto Build & Release

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Har Sunday raat 2 baje auto-check karega
    - cron: '0 2 * * 0'
  # Manual trigger bhi available hai
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Custom release notes'
        required: false
        type: string
        default: ''

# Full permissions for auto push/tag/release
permissions:
  contents: write
  issues: write
  discussions: write
  pull-requests: write
  actions: write

# Environment variables
env:
  APP_NAME: "ThinkForge AI"
  PACKAGE_NAME: "com.thinkforge.ai.chat"
  GRADLE_VERSION: "8.5"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_COMPILE_SDK: "34"

jobs:
  # ============================================================
  # JOB 1: Version Management 🏷️
  # ============================================================
  version:
    name: 📌 Auto Version Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🔢 Auto Generate Version Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          tag_prefix: "v"
          default_bump: ${{ github.event.inputs.version_bump || 'patch' }}
          create_annotated_tag: true
          dry_run: false
          append_to_pre_release_tag: "beta"
          pre_release_branches: "develop"
          release_branches: "main,master"
          custom_release_notes: ${{ github.event.inputs.release_notes || '' }}

      - name: 📝 Show Version Info
        run: |
          echo "New Tag: ${{ steps.tag_version.outputs.new_tag }}"
          echo "New Version: ${{ steps.tag_version.outputs.new_version }}"
          echo "Changelog: ${{ steps.tag_version.outputs.changelog }}"

  # ============================================================
  # JOB 2: Build Android App 📱
  # ============================================================
  build:
    name: 📱 Build Android App
    runs-on: ubuntu-latest
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
          ndk-version: '26.1.10909125'
          cmake-version: '3.22.1'

      - name: 🔧 Grant Gradle Execute Permission
        run: chmod +x gradlew

      - name: 📦 Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/*.lock
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 🏗️ Build Debug APK
        id: build_debug
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "apk_path=$(find app/build/outputs -name '*.apk' -type f | head -1)" >> $GITHUB_OUTPUT
          echo "apk_size=$(du -sh app/build/outputs 2>/dev/null | cut -f1)" >> $GITHUB_OUTPUT

      - name: 🏗️ Build Release APK (AAB)
        id: build_release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace
          echo "aab_path=$(find app/build/outputs -name '*.aab' -type f | head -1)" >> $GITHUB_OUTPUT

      - name: 🧪 Run Tests
        run: |
          ./gradlew test --no-daemon --continue || true

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThinkForgeAI-${{ needs.version.outputs.new_tag }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          retention-days: 90
          if-no-files-found: warn

      - name: 📋 Generate Build Report
        run: |
          echo "## 📱 Build Summary" > build_report.md
          echo "" >> build_report.md
          echo "| Item | Value |" >> build_report.md
          echo "|------|-------|" >> build_report.md
          echo "| **Version** | ${{ needs.version.outputs.new_tag }} |" >> build_report.md
          echo "| **App Name** | ${{ env.APP_NAME }} |" >> build_report.md
          echo "| **Package** | ${{ env.PACKAGE_NAME }} |" >> build_report.md
          echo "| **Build Time** | $(date) |" >> build_report.md
          echo "| **APK Size** | ${{ steps.build_debug.outputs.apk_size }} |" >> build_report.md
          echo "| **Workflow** | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> build_report.md
          echo "| **Commit** | ${{ github.sha }} |" >> build_report.md
          cat build_report.md

      - name: 📤 Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ needs.version.outputs.new_tag }}
          path: build_report.md

  # ============================================================
  # JOB 3: GitHub Release 🎉
  # ============================================================
  release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    permissions:
      contents: write
      discussions: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📥 Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ThinkForgeAI-${{ needs.version.outputs.new_tag }}
          path: ./artifacts

      - name: 📥 Download Build Report
        uses: actions/download-artifact@v4
        with:
          name: build-report-${{ needs.version.outputs.new_tag }}
          path: ./reports

      - name: 📝 Generate Release Notes
        id: release_notes
        run: |
          NOTES="${{ github.event.inputs.release_notes || needs.version.outputs.changelog }}"
          
          if [ -z "$NOTES" ]; then
            NOTES="## 🚀 ThinkForge AI ${{ needs.version.outputs.new_tag }}
            
          ### 📱 What's New
          - Auto-build Android APK
          - Optimized for ARM64
          - Material You UI
          - 1M context window
          
          ### 📦 Downloads
          - **APK**: See attached artifacts
          - **AAB**: See attached artifacts
          
          ### ⚙️ Build Details
          - **Build Time**: $(date -u)
          - **Workflow**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ### 🧠 About
          ThinkForge AI Pro — Local AI Assistant running on your Android device.
          671B total parameters, 45B active per token, 1M context window.
          "
          fi
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🎉 Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: "ThinkForge AI ${{ needs.version.outputs.new_tag }}"
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            ./artifacts/**/*.apk
            ./artifacts/**/*.aab
            ./reports/*.md
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          generate_release_notes: true
          discussion_category_name: "Announcements"

  # ============================================================
  # JOB 4: Auto Push & Sync 📤
  # ============================================================
  sync:
    name: 📤 Auto Push & Sync
    runs-on: ubuntu-latest
    needs: [version, build]
    if: always()
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🔄 Auto Sync Branches
        run: |
          git config user.name "ThinkForge AI Bot"
          git config user.email "bot@thinkforge.ai"
          
          # Auto-merge develop to main agar develop branch hai
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            git fetch origin main
            git checkout main
            git merge develop --no-ff -m "🤖 Auto-merge develop → main [skip ci]"
            git push origin main
          fi
          
          # Update version in code
          NEW_VER="${{ needs.version.outputs.new_version }}"
          if [ ! -z "$NEW_VER" ]; then
            # Update versionName in build.gradle (Kotlin DSL safe)
            sed -i "s/versionName = \".*\"/versionName = \"$NEW_VER\"/" app/build.gradle.kts
            # Fallback if plain versionName used
            sed -i "s/versionName \"[0-9.]*\"/versionName \"$NEW_VER\"/" app/build.gradle.kts
            git add app/build.gradle.kts
            git commit -m "🤖 Auto bump version to $NEW_VER [skip ci]" || true
            git push origin HEAD || true
          fi

      - name: 📊 Update Project Stats
        run: |
          echo "📊 Project Status:" 
          echo "✅ Build Complete: ${{ needs.build.result }}"
          echo "🏷️ Version: ${{ needs.version.outputs.new_tag }}"
          echo "🎉 Release: ${{ needs.release.result || 'skipped' }}"

  # ============================================================
  # JOB 5: Monitor & Watch 👁️
  # ============================================================
  monitor:
    name: 👁️ Monitor & Health Check
    runs-on: ubuntu-latest
    needs: build
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
      - name: 🚨 Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Build Failed - ${{ github.run_id }}`;
            const body = `
            ## ❌ Build Failed
            
            **Workflow:** [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Branch:** ${{ github.ref }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            
            ### Error Details
            Check the workflow run for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ### Auto-Fix Attempted
            A new attempt will be triggered automatically.
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'auto-failed']
            });

      - name: 🔄 Retry Failed Build
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-and-release.yml',
              ref: 'main',
              inputs: {
                version_bump: 'patch',
                release_notes: '🤖 Auto-retry after failure'
              }
            });
            
  # ============================================================
  # JOB 6: Success Notification ✅
  # ============================================================
  notify:
    name: ✅ Completion Report
    runs-on: ubuntu-latest
    needs: [build, release, sync]
    if: success()
    
    steps:
      - name: ✅ Print Success Summary
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║   ✅ THINKFORGE AI BUILD COMPLETE    ║"
          echo "╠══════════════════════════════════════╣"
          echo "║  Version: ${{ needs.version.outputs.new_tag || 'no-change' }}        ║"
          echo "║  Status: ✅ SUCCESS                  ║"
          echo "║  Build: ${{ needs.build.result }}                     ║"
          echo "║  Release: ${{ needs.release.result || 'N/A' }}                   ║"
          echo "║  Sync: ${{ needs.sync.result }}                       ║"
          echo "║  Workflow: ${{ github.run_id }}               ║"
          echo "║  Repo: ${{ github.repository }}       ║"
          echo "╚══════════════════════════════════════╝"

      - name: 📝 Export Build Summary
        run: |
          cat > summary.json << 'EOF'
          {
            "version": "${{ needs.version.outputs.new_tag || '' }}",
            "status": "success",
            "build_id": "${{ github.run_id }}",
            "timestamp": "$(date -Iseconds)",
            "repository": "${{ github.repository }}"
          }
          EOF
          echo "✅ Summary exported"

      - name: 📤 Upload Build Summary to Release
        if: needs.release.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.version.outputs.new_tag }}
          files: summary.json
          append_body: true